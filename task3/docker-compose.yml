version: "3.9"

services:
  api:
    build: .
    container_name: patient-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    container_name: patient-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: patient
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: patients

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient -d patients"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: patient-redis
    restart: unless-stopped

    ports:
      - "6379:6379"




volumes:
  postgres_data: